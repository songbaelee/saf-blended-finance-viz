<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAF Blended Finance Structure — Morph</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
  :root{
    --ink:#1F2A2E;
    --line:#2F6FA8;
    --box-fill:#FFFFFF;
    --outer-fill:#FFFFFF;
    --bg:#F7F5F1;
  }
  html,body{
    margin:0;
    padding:0;
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    color:var(--ink);
  }
  .wrap{
    max-width:1400px;
    margin:0 auto;
    padding:32px 20px 60px;
  }
  h1{
    font-size:20px;
    margin:0 0 4px;
  }
  p.sub{
    font-size:14px;
    color:#5B6B6E;
    margin:0 0 28px;
  }
  .comparator-link{
    font-size:13px;
    margin:-16px 0 20px;
  }
  .comparator-link a{
    color:var(--line);
    text-decoration:none;
  }
  .comparator-link a:hover{
    text-decoration:underline;
  }
  #stage-label{
    font-size:13px;
    font-weight:600;
    color:var(--line);
    margin-bottom:10px;
    min-height:18px;
  }
  svg{
    width:100%;
    height:auto;
    display:block;
    background:var(--outer-fill);
    border:1px solid #E3E0D6;
    border-radius:6px;
  }
  .box-label{
    font-size:13px;
    font-weight:600;
    text-anchor:middle;
  }
  .box-rect{
    fill:var(--box-fill);
    stroke:var(--line);
    stroke-width:1.5;
  }
  .outer-rect{
    fill:none;
    stroke:var(--line);
    stroke-width:1.5;
  }
  .saf-slice{
    fill:var(--line);
  }
  .private-slice{
    fill:var(--box-fill);
    stroke:var(--line);
    stroke-width:1;
  }
  .new-funding-rect{
    fill:var(--box-fill);
    stroke:var(--line);
    stroke-width:1.5;
    stroke-dasharray:6,4;
  }
  .nf-piece-rect{
    fill:var(--box-fill);
    stroke:var(--line);
    stroke-width:1;
    stroke-dasharray:2,1.5;
  }
  .koica-inset-rect{
    fill:var(--bg);
    stroke:var(--line);
    stroke-width:1;
    stroke-dasharray:3,2;
  }
  .controls{
    margin-top:20px;
    display:flex;
    gap:10px;
  }
  button{
    font-size:13px;
    padding:8px 16px;
    border-radius:4px;
    border:1px solid var(--line);
    background:#fff;
    color:var(--line);
    cursor:pointer;
  }
  button:disabled{
    opacity:0.4;
    cursor:default;
  }
  button:hover:not(:disabled){
    background:var(--line);
    color:#fff;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>SAF Blended Finance Structure</h1>
  <p class="sub">Starting point: KOICA IPS Call for Proposals, Annex 2 — Model 2 (TA Facility variant)</p>
  <p class="comparator-link"><a href="fund_comparison_diagrams_only.html">View comparator fund diagrams &rarr;</a></p>
  <div id="stage-label">Stage 1 of 14 — CFP template, as published</div>

  <svg id="diagram" viewBox="0 0 1100 350" xmlns="http://www.w3.org/2000/svg">
    <!-- Outer container: Blended Finance Structure -->
    <rect id="outer-box" class="outer-rect" x="20" y="20" width="500" height="200" rx="4"/>
    <text id="outer-box-label" x="270" y="45" class="box-label" font-size="14">Blended Finance Structure</text>

    <!-- Technical Assistance Facility -->
    <g id="ta-facility">
      <rect class="box-rect" x="36" y="65" width="130" height="135" rx="3"/>
      <text x="101" y="120" class="box-label">Technical</text>
      <text x="101" y="138" class="box-label">Assistance</text>
      <text x="101" y="156" class="box-label">Facility</text>
    </g>

    <!-- TA Facility's 5-tier Theory of Change pyramid (Acorn-style).
         Geometry: ONE triangle first — apex (350,65), base corners
         (210,235)/(490,235) — sliced into 5 equal-height horizontal
         bands (34px each). Both outer edges are a single straight line
         at constant slope (half-width = 140*(y-65)/170, i.e. 0.8235px
         of half-width — 1.647px of total width — per row) all the way
         from apex to base; tier boundaries are just horizontal cuts
         across that one line, not separately-angled shapes stacked on
         each other (that was the earlier bug: the apex tier was drawn
         with its own steeper local slope instead of continuing the
         frustum's line up to the true apex point). Appears beside the
         detached TA Facility box (stage 8), hidden until then. All five
         tiers share identical fill/stroke (box-rect) and no class on the
         labels — a class="box-label" font-size override gets beaten by
         the .box-label CSS rule's own font-size, which would blow the
         tiny apex text back up to 13px, so size/weight/anchor are set
         directly as attributes here instead. Scale is folded into the
         top three tiers' names (Global/Regional/Local), so no separate
         scale-prefix labels. -->
    <g id="ta-pyramid" style="opacity:0">
      <polygon class="box-rect" points="210,235 490,235 462,201 238,201"/>
      <text x="350" y="222" text-anchor="middle" font-weight="600" font-size="12">Agroforestry</text>

      <polygon class="box-rect" points="238,201 462,201 434,167 266,167"/>
      <text x="350" y="188" text-anchor="middle" font-weight="600" font-size="10">Improved Livelihoods</text>

      <!-- Top three tiers are each wrapped in their own group so a later
           stage can fade them down together (de-emphasize without
           touching the bottom two, Agroforestry/Improved Livelihoods,
           which stay at full weight). -->
      <g id="pyramid-tier3" style="opacity:1">
        <polygon class="box-rect" points="266,167 434,167 406,133 294,133"/>
        <text x="350" y="154" text-anchor="middle" font-weight="600" font-size="9">Local Adaptation</text>
      </g>

      <g id="pyramid-tier4" style="opacity:1">
        <polygon class="box-rect" points="294,133 406,133 378,99 322,99"/>
        <text x="350" y="124" text-anchor="middle" font-weight="600" font-size="8">Regional Resilience</text>
      </g>

      <!-- Apex: true triangle (3 points, no flat top), base corners
           (322,99)/(378,99) sitting exactly on the same line as every
           tier below — text sits in the triangle's wider lower half
           since the pointed tip itself has no room for it. -->
      <g id="pyramid-tier5" style="opacity:1">
        <polygon class="box-rect" points="322,99 378,99 350,65"/>
        <text x="350" y="88" text-anchor="middle" font-weight="600" font-size="7">Global</text>
        <text x="350" y="96" text-anchor="middle" font-weight="600" font-size="7">Mitigation</text>
      </g>
    </g>

    <!-- Single TA Facility -> Agroforestry connector (not the earlier
         15-line portfolio version, which was intentionally replaced by
         the box-split mechanic — this is the one standalone link kept:
         the facility feeding the pyramid's base tier). Hidden until the
         pyramid itself appears. -->
    <defs>
      <marker id="ta-link-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#2F6FA8"/>
      </marker>
    </defs>
    <line id="ta-pyramid-link" x1="166" y1="172" x2="220" y2="219" stroke="#2F6FA8" stroke-width="1.5" marker-end="url(#ta-link-arrow)" style="opacity:0"/>

    <!-- New Funding: a second, smaller, dashed-border box appearing at
         the same detached-focus spot the original TA Facility box
         occupied (before it split into 15) — deliberately smaller and
         dashed so it reads as a distinct, additional stream rather than
         a continuation of the original solid box. Hidden until stage 11. -->
    <g id="new-funding" style="opacity:0">
      <rect class="new-funding-rect" x="56" y="142" width="90" height="60" rx="3"/>
      <!-- Two lines (matching Private Capital's own name/subtext pattern)
           since "New Funding (KOICA)" doesn't fit this box's width on one
           line. Direct attribution here (vs. First-Loss Capital's softer
           "incl. KOICA") since New Funding IS specifically KOICA's
           incremental contribution, not a shared tranche with other
           contributors. -->
      <text x="101" y="168" text-anchor="middle" font-weight="600" font-size="12">New Funding</text>
      <text x="101" y="186" text-anchor="middle" font-weight="600" font-size="11">(KOICA)</text>
    </g>

    <!-- New Funding -> Improved Livelihoods connector: one tier up from
         Agroforestry (the TA Facility link's target) — the distinguishing
         point of this funding stream. Dashed shaft (vs. the solid
         ta-pyramid-link) keeps it visually distinct while reusing the
         same blue and the same arrowhead marker. Hidden until stage 12. -->
    <line id="new-funding-link" x1="146" y1="172" x2="258" y2="190" stroke="#2F6FA8" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ta-link-arrow)" style="opacity:0"/>

    <!-- Senior Debt / Junior Debt: fill the column Private Capital
         vacates, stacked (mirroring how Private Capital sat stacked
         above First-Loss Capital). Hidden (opacity 0) until stage 3. -->
    <g id="senior-debt" style="opacity:0">
      <rect class="box-rect" x="190" y="65" width="310" height="26" rx="3"/>
      <text x="345" y="82" class="box-label" font-size="12">Senior Debt</text>
    </g>
    <g id="junior-debt" style="opacity:0">
      <rect class="box-rect" x="190" y="99" width="310" height="26" rx="3"/>
      <text x="345" y="116" class="box-label" font-size="12">Junior Debt</text>
    </g>

    <!-- SAF Capital: Senior Debt, Junior Debt, and First-Loss Capital all
         visually merge into this single undifferentiated block in stage 4,
         before splitting pro rata across the 15 project boxes. Hidden
         until then. Sized to the full column footprint the three tranches
         occupy together (y65-200), not just one tranche's share of it. -->
    <g id="saf-capital-merged" style="opacity:0">
      <rect class="box-rect" x="190" y="65" width="310" height="135" rx="3"/>
      <text x="345" y="137" class="box-label">SAF Capital</text>
    </g>

    <!-- Private Capital: stage 1 position shown here. In stage 2 this
         group is translated below the outer box (pulled out, not
         deleted — it reappears, redefined, in a later stage). -->
    <g id="private-capital">
      <rect class="box-rect" x="190" y="65" width="310" height="68" rx="3"/>
      <text x="345" y="94" class="box-label">Private Capital</text>
      <!-- Two stacked subtext lines, crossfaded at the stage 5 -> 6
           transition (right before the box itself fades/splits) rather
           than a plain text swap — a plain textContent change wouldn't
           reverse cleanly on Prev, since GSAP callbacks fire the same way
           regardless of scrub direction, while opacity tweens interpolate
           correctly both ways under tweenTo/seek. Original wording shown
           stages 1-5; new wording from stage 6 onward. -->
      <text id="private-capital-subtext-old" x="345" y="112" class="box-label" font-size="11">(senior debt or equity)</text>
      <text id="private-capital-subtext-new" x="345" y="112" class="box-label" font-size="11" style="opacity:0">(corporate buyers purchasing CRUs)</text>
    </g>

    <!-- First-Loss Capital: attached directly beneath Private Capital (no
         gap between them) from stage 1 onward, matching the original CFP
         Annex 2 diagram. Together the two fill the full 65-200 column,
         same footprint the tranches redistribute across from stage 3. -->
    <g id="first-loss-capital">
      <rect class="box-rect" x="190" y="133" width="310" height="67" rx="3"/>
      <text x="345" y="172" class="box-label">First-Loss Capital</text>
      <!-- KOICA inset: a portion within First-Loss Capital, not the whole
           tranche (other contributors are part of it too) — dashed,
           lightly-shaded (--bg fill, not white) so it reads as a distinct
           subsection rather than a continuation of the main box. No
           dollar figures/percentages since exact numbers aren't final.
           Nested inside first-loss-capital so it inherits that group's
           later fade/nudge for free instead of needing its own tweens for
           those. Positioned clear of the centered "First-Loss Capital"
           label (which spans roughly x277-413 at the box's final,
           post-resize size) and sized modestly against that final band
           (170-200) — a portion of the box, not a claim on all of it.
           Starts hidden; fades in as part of stage 2 -> 3's resize. -->
      <g id="koica-inset" style="opacity:0">
        <rect class="koica-inset-rect" x="198" y="176" width="72" height="18" rx="2"/>
        <text x="234" y="188" text-anchor="middle" font-weight="600" font-size="7.5">incl. KOICA</text>
      </g>
    </g>

    <!-- Annotation shown once Private Capital is pulled out. Sits below
         the pulled-out box's bottom edge (y65+68+185=318) with clear
         space, not flush against its border. -->
    <text id="pulled-out-note" x="345" y="340" font-size="11" fill="#5B6B6E" text-anchor="middle" style="opacity:0">(pulled out — moved outside the Blended Finance Structure)</text>
  </svg>

  <div class="controls">
    <button id="prev-btn" disabled>&larr; Prev</button>
    <button id="next-btn">Next &rarr;</button>
    <button id="reset-btn" disabled>Reset</button>
  </div>
</div>

<script>
  // ---------------------------------------------------------------
  // Stage 4 setup: build the 15-project portfolio grid + the SAF
  // capital slices that will fly out to it. Generated at runtime
  // (rather than hand-written 15x in markup) since all 15 are
  // structurally identical. Everything starts hidden (opacity 0)
  // and is faded/moved in by the timeline below.
  // ---------------------------------------------------------------
  const svgNS = "http://www.w3.org/2000/svg";
  const diagram = document.getElementById("diagram");

  // boxH has extra headroom below the TA piece (42-56) for the New
  // Funding piece at the 2 projects that get one — unused space at the
  // other 13, kept uniform across all 15 so the grid stays even.
  const GRID = { cols: 5, rows: 3, boxW: 90, boxH: 58, gapX: 14, gapY: 14, startX: 560, startY: 65 };
  // Matches saf-capital-merged's full-column footprint (see markup) so the
  // pre-flyout strips fill the same size block they're splitting from.
  const SLICE_ORIGIN = { x: 190, y: 65, w: 310, h: 135 };
  const sliceWidth = SLICE_ORIGIN.w / 15;
  // Private Capital's resting spot from stage 2 onward: same box, translated
  // down (y + 185, per the stage1 tween below) — used as the fly-out origin
  // for the stage-5 private-capital slices.
  const PRIVATE_ORIGIN = { x: 190, y: 65 + 185, w: 310, h: 60 };
  const privateSliceWidth = PRIVATE_ORIGIN.w / 15;
  // TA Facility's resting spot from stage 7 onward: same box, translated
  // down (y + 40, per the stage6 tween below) — used as the fly-out origin
  // for the stage-10 TA pieces.
  const TA_ORIGIN = { x: 36, y: 65 + 40, w: 130, h: 135 };
  const taSliceWidth = TA_ORIGIN.w / 15;
  // New Funding's own resting footprint (stage 11 onward) — used as the
  // fly-out origin for its stage-13 split into 2 pieces.
  const NEW_FUNDING_ORIGIN = { x: 56, y: 142, w: 90, h: 60 };
  const nfSliceWidth = NEW_FUNDING_ORIGIN.w / 2;
  // The 2 of 15 projects New Funding reaches — picked arbitrarily,
  // per the brief ("doesn't matter which").
  const NEW_FUNDING_TARGETS = [2, 8]; // Project 3, Project 9
  const gridRight = GRID.startX + GRID.cols * (GRID.boxW + GRID.gapX) - GRID.gapX;
  const gridBottom = GRID.startY + GRID.rows * (GRID.boxH + GRID.gapY) - GRID.gapY;

  const PROJECTS = [];
  for (let i = 0; i < 15; i++) {
    const col = i % GRID.cols;
    const row = Math.floor(i / GRID.cols);
    const x = GRID.startX + col * (GRID.boxW + GRID.gapX);
    const y = GRID.startY + row * (GRID.boxH + GRID.gapY);
    PROJECTS.push({
      index: i, x, y,
      // Capital column (Private on top of SAF, touching — same as
      // before) is now the RIGHT side of a two-column mini layout,
      // narrower than before (54 vs the old 74) to share room with the
      // new TA sub-box on the left. Private's rect is inset by half the
      // class's 1px stroke on each side (x+0.5, width-1) — .private-slice
      // has a visible stroke while .saf-slice is fill-only, and an SVG
      // stroke straddles the path, so without this the stroke would make
      // the private bar render ~1px wider than the SAF bar even though
      // both share the same underlying x/width formula.
      privateX: x + 30.5, privateY: y + 18, privateW: 53, privateH: 11,
      sliceX: x + 30, sliceY: y + 29, sliceW: 54, sliceH: 11,
      // TA piece — its own small bordered box (mirrors how the top-level
      // Blended Finance Structure box separates TA Facility from the
      // capital tranches: a distinct box beside the capital stack, not a
      // band above/below it), sitting to the left of the capital column
      // with a 4px gap — not touching, not overlapping.
      taX: x + 6, taY: y + 18, taW: 20, taH: 22,
      taLabelX: x + 16, taLabelY: y + 32,
      // New Funding piece — only used at the 2 target projects, stacked
      // below the TA piece in the same left column (2px gap, not
      // touching/overlapping it), same dashed treatment as the source box.
      nfX: x + 6, nfY: y + 42, nfW: 20, nfH: 14,
      nfLabelX: x + 16, nfLabelY: y + 52
    });
  }

  function svgEl(tag, attrs) {
    const el = document.createElementNS(svgNS, tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }

  // Portfolio label + provisional note (this stage resolves, for
  // visualization purposes, an open question flagged elsewhere: whether
  // Senior Debt flows to project level the same way Junior Debt does).
  const portfolioLabel = svgEl("text", {
    x: (GRID.startX + gridRight) / 2, y: GRID.startY - 15,
    class: "box-label", "font-size": 14
  });
  portfolioLabel.id = "portfolio-label";
  portfolioLabel.style.opacity = 0;
  portfolioLabel.textContent = "Portfolio — 15 Projects";
  diagram.appendChild(portfolioLabel);

  const prorataNote = svgEl("text", {
    x: (GRID.startX + gridRight) / 2, y: gridBottom + 20,
    "font-size": 11, fill: "#5B6B6E", "text-anchor": "middle"
  });
  prorataNote.id = "prorata-note";
  prorataNote.style.opacity = 0;
  prorataNote.textContent = "(pro rata split shown for both tranches)";
  diagram.appendChild(prorataNote);

  // Stage 5 clarifying note, stacked below the pro-rata note (not
  // overlapping it): Private Capital's slices are a separate layer, not
  // part of SAF's own capital structure.
  const privateNote = svgEl("text", {
    x: (GRID.startX + gridRight) / 2, y: gridBottom + 37,
    "font-size": 11, fill: "#5B6B6E", "text-anchor": "middle"
  });
  privateNote.id = "private-capital-note";
  privateNote.style.opacity = 0;
  privateNote.textContent = "(private capital raised independently by each Local Partner — not part of SAF's own capital structure)";
  diagram.appendChild(privateNote);

  // Stage 10 clarifying note, stacked below the other two (not
  // overlapping either): the TA piece at each project is the existing TA
  // Facility reaching that project, not a capital instrument.
  const taNote = svgEl("text", {
    x: (GRID.startX + gridRight) / 2, y: gridBottom + 54,
    "font-size": 11, fill: "#5B6B6E", "text-anchor": "middle"
  });
  taNote.id = "ta-piece-note";
  taNote.style.opacity = 0;
  taNote.textContent = "(small bordered box: existing TA Facility support, reaching all 15 projects evenly — not a capital instrument)";
  diagram.appendChild(taNote);

  // Stage 13 clarifying note, stacked below the other three (not
  // overlapping any): New Funding is a distinct, smaller stream reaching
  // only 2 of the 15 projects, feeding the Livelihoods tier specifically.
  const nfNote = svgEl("text", {
    x: (GRID.startX + gridRight) / 2, y: gridBottom + 71,
    "font-size": 11, fill: "#5B6B6E", "text-anchor": "middle"
  });
  nfNote.id = "nf-note";
  nfNote.style.opacity = 0;
  nfNote.textContent = "(New Funding — reaches 2 of 15 projects, feeding the Livelihoods tier)";
  diagram.appendChild(nfNote);

  // 15 project boxes
  PROJECTS.forEach(p => {
    const g = svgEl("g", {});
    g.setAttribute("class", "project-box");
    g.id = `project-${p.index}`;
    g.style.opacity = 0;
    g.appendChild(svgEl("rect", {
      class: "box-rect", x: p.x, y: p.y, width: GRID.boxW, height: GRID.boxH, rx: 3
    }));
    g.appendChild(svgEl("text", {
      class: "box-label", "font-size": 9, x: p.x + GRID.boxW / 2, y: p.y + 13
    })).textContent = `Project ${p.index + 1}`;
    diagram.appendChild(g);
  });

  // 15 SAF capital slices — start as equal-width strips filling the
  // merged capital block's footprint, then fly out to their project.
  PROJECTS.forEach(p => {
    const slice = svgEl("rect", {
      class: "saf-slice",
      x: SLICE_ORIGIN.x + p.index * sliceWidth, y: SLICE_ORIGIN.y,
      width: sliceWidth, height: SLICE_ORIGIN.h, rx: 1
    });
    slice.id = `saf-slice-${p.index}`;
    slice.style.opacity = 0;
    diagram.appendChild(slice);
  });

  // 15 Private Capital slices — same even 1/15th split, starting as equal
  // strips filling Private Capital's parked footprint, then flying out to
  // land as a distinct (hollow-style) band under each SAF slice. Kept as
  // separate elements from .saf-slice throughout — they never merge.
  PROJECTS.forEach(p => {
    const slice = svgEl("rect", {
      class: "private-slice",
      x: PRIVATE_ORIGIN.x + p.index * privateSliceWidth, y: PRIVATE_ORIGIN.y,
      width: privateSliceWidth, height: PRIVATE_ORIGIN.h, rx: 1
    });
    slice.id = `private-slice-${p.index}`;
    slice.style.opacity = 0;
    diagram.appendChild(slice);
  });

  // 15 TA Facility pieces — same even 1/15th split, starting as equal
  // strips filling the detached TA Facility box's footprint, then flying
  // out to land as a small bordered box (box-rect — the exact same style
  // as the top-level TA Facility box) beside each project's capital
  // column. A separate "TA" label sits at the box's final resting spot
  // from the start (opacity 0) — it doesn't fly, it just fades in once
  // its box has landed.
  PROJECTS.forEach(p => {
    const rect = svgEl("rect", {
      class: "box-rect ta-piece-rect",
      x: TA_ORIGIN.x + p.index * taSliceWidth, y: TA_ORIGIN.y,
      width: taSliceWidth, height: TA_ORIGIN.h, rx: 2
    });
    rect.id = `ta-piece-rect-${p.index}`;
    rect.style.opacity = 0;
    diagram.appendChild(rect);

    const label = svgEl("text", {
      x: p.taLabelX, y: p.taLabelY, "text-anchor": "middle",
      "font-weight": "600", "font-size": 7
    });
    label.id = `ta-piece-label-${p.index}`;
    label.style.opacity = 0;
    label.textContent = "TA";
    diagram.appendChild(label);
  });

  // 2 New Funding pieces (only at NEW_FUNDING_TARGETS, not all 15) — same
  // split/flyout/label-reveal mechanic as the TA pieces, dashed style
  // (nf-piece-rect) throughout to match the source box's dashed treatment.
  NEW_FUNDING_TARGETS.forEach((projectIndex, i) => {
    const p = PROJECTS[projectIndex];
    const rect = svgEl("rect", {
      class: "nf-piece-rect",
      x: NEW_FUNDING_ORIGIN.x + i * nfSliceWidth, y: NEW_FUNDING_ORIGIN.y,
      width: nfSliceWidth, height: NEW_FUNDING_ORIGIN.h, rx: 2
    });
    rect.id = `nf-piece-rect-${i}`;
    rect.style.opacity = 0;
    diagram.appendChild(rect);

    const label = svgEl("text", {
      x: p.nfLabelX, y: p.nfLabelY, "text-anchor": "middle",
      "font-weight": "700", "font-size": 9
    });
    label.id = `nf-piece-label-${i}`;
    label.style.opacity = 0;
    label.textContent = "+";
    diagram.appendChild(label);
  });

  // ---------------------------------------------------------------
  // Timeline. Each confirmed stage gets a label; Next/Prev step
  // between labels with tl.tweenTo(). Add future stages by appending
  // more tweens + addLabel("stageN") below stage 3.
  // ---------------------------------------------------------------
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power2.inOut" } });

  tl.addLabel("stage1")
    // Stage 1 -> 2: Private Capital slides down, out of the Blended
    // Finance Structure. Senior/Junior Debt stay hidden — nothing else
    // happens yet.
    .to("#private-capital", { y: 185, duration: 1 }, "stage1")
    // Annotation clarifies Private Capital wasn't deleted, just relocated.
    .to("#pulled-out-note", { opacity: 1, duration: 0.6 }, "stage1+=0.7")
    .addLabel("stage2")
    // Stage 2 -> 3: Senior Debt / Junior Debt fade into the now-vacant,
    // stacked column. At the same beat, the column redistributes: First-
    // Loss Capital shrinks down to a subordinate-sized box and Senior /
    // Junior Debt grow into the two large, roughly-equal boxes that now
    // dominate the column (46 / 47 / 30 px of the same 135px column,
    // top to bottom) — the column's full height doesn't change, just how
    // it's divided among the three.
    .to("#senior-debt, #junior-debt", { opacity: 1, duration: 0.8 }, "stage2+=0.1")
    .to("#senior-debt rect", { attr: { y: 65, height: 46 }, duration: 0.8 }, "stage2+=0.1")
    .to("#senior-debt text", { attr: { y: 92 }, duration: 0.8 }, "stage2+=0.1")
    .to("#junior-debt rect", { attr: { y: 117, height: 47 }, duration: 0.8 }, "stage2+=0.1")
    .to("#junior-debt text", { attr: { y: 144 }, duration: 0.8 }, "stage2+=0.1")
    // Direct-child selectors ("> rect" / "> text"), not descendant
    // selectors — the KOICA inset added below nests its own <rect>/<text>
    // inside first-loss-capital too, and plain "#first-loss-capital rect"
    // / "text" selectors would wrongly catch those as well and drag them
    // into the main box's resize along with it.
    .to("#first-loss-capital > rect", { attr: { y: 170, height: 30 }, duration: 0.8 }, "stage2+=0.1")
    .to("#first-loss-capital > text", { attr: { y: 189 }, duration: 0.8 }, "stage2+=0.1")
    // KOICA inset fades in as the resize settles — it's a fixed position
    // within the box's final (post-resize) footprint, not itself
    // attr-tweened, since that final position stays inside the box's
    // bounds throughout the resize (the box only shrinks from the top;
    // the inset sits in the lower portion of the final band).
    .to("#koica-inset", { opacity: 1, duration: 0.4 }, "stage2+=0.4")
    .addLabel("stage3")
    // Stage 3 -> 4: the 15 project boxes appear to the right, on their own
    // beat. Nothing on the tranche side moves — this stage is just the
    // portfolio grid showing up; the merge happens in the next stage.
    .to("#portfolio-label", { opacity: 1, duration: 0.5 }, "stage3+=0.1")
    .to(".project-box", { opacity: 1, duration: 0.6, stagger: 0.03 }, "stage3+=0.1")
    .addLabel("stage4")
    // Stage 4 -> 5a: Senior Debt, Junior Debt, AND First-Loss Capital all
    // converge and crossfade into a single undifferentiated "SAF Capital"
    // block that now spans their full combined footprint. The three
    // already tile that footprint contiguously (Junior anchors the middle;
    // Senior and First-Loss each close their small gap toward it — First-
    // Loss sets off earlier since it has to close a gap on top of being
    // further away), so only a small closing nudge is needed before the
    // crossfade into the single big block.
    .to("#senior-debt", { y: 6, duration: 0.6 }, "stage4+=0.4")
    .to("#first-loss-capital", { y: -6, duration: 1.0 }, "stage4+=0.2")
    .to("#senior-debt, #junior-debt, #first-loss-capital", { opacity: 0, duration: 0.4 }, "stage4+=1.2")
    .to("#saf-capital-merged", { opacity: 1, duration: 0.4 }, "stage4+=1.2")
    // Stage 4 -> 5b: the merged block splits into 15 equal (pro rata)
    // slices, which fly out to land inside their project box.
    .to("#saf-capital-merged", { opacity: 0, duration: 0.3 }, "stage4+=1.9")
    .to(".saf-slice", { opacity: 1, duration: 0.3 }, "stage4+=1.9")
    .to("#prorata-note", { opacity: 1, duration: 0.5 }, "stage4+=2.3");

  PROJECTS.forEach((p, i) => {
    // attr:{} is required here — plain x/y/width/height on a <rect>
    // get treated as CSS pixel styles by GSAP, not SVG attributes.
    tl.to(`#saf-slice-${i}`, {
      attr: { x: p.sliceX, y: p.sliceY, width: p.sliceW, height: p.sliceH },
      duration: 0.9
    }, `stage4+=${2.1 + i * 0.04}`);
  });

  tl.addLabel("stage5")
    // Stage 5 -> 6: ONLY the subtext crossfades, from the original CFP
    // wording to the corporate-buyers/CRU framing — nothing else moves.
    // Split into its own stage (rather than bundled with the split/
    // flyout that follows) so the label change itself is slow enough to
    // actually notice instead of flashing by mid-animation.
    .to("#private-capital-subtext-old", { opacity: 0, duration: 0.3 }, "stage5+=0.2")
    .to("#private-capital-subtext-new", { opacity: 1, duration: 0.3 }, "stage5+=0.2")
    .addLabel("stage6")
    // Stage 6 -> 7: Private Capital (already showing the new wording)
    // splits into 15 equal pieces and flies to the portfolio grid,
    // landing as a distinct layer alongside (not merged into) each
    // project's SAF Capital slice. Mirrors the stage 4/5 split/flyout
    // pacing: source box fades as its slices appear, then the slices fly
    // out staggered.
    .to("#private-capital", { opacity: 0, duration: 0.3 }, "stage6+=0.3")
    .to(".private-slice", { opacity: 1, duration: 0.3 }, "stage6+=0.3")
    .to("#private-capital-note", { opacity: 1, duration: 0.5 }, "stage6+=0.7");

  PROJECTS.forEach((p, i) => {
    tl.to(`#private-slice-${i}`, {
      attr: { x: p.privateX, y: p.privateY, width: p.privateW, height: p.privateH },
      duration: 0.9
    }, `stage6+=${0.5 + i * 0.04}`);
  });

  tl.addLabel("stage7")
    // Stage 7 -> 8: TA Facility detaches into its own focused view. The
    // Blended Finance Structure framing and its label fade away, along
    // with the now-orphaned "pulled out" annotation (Private Capital
    // itself already faded out back in stage 6->7 — everything else on
    // the capital side is already invisible by this point). The
    // portfolio grid stays exactly as it is; only the TA Facility box
    // itself moves, repositioning to sit beside where the pyramid
    // appears next.
    .to("#outer-box, #outer-box-label, #pulled-out-note", { opacity: 0, duration: 0.6 }, "stage7+=0.1")
    .to("#ta-facility", { y: 40, duration: 1 }, "stage7+=0.1")
    .addLabel("stage8")
    // Stage 8 -> 9: the 5-tier TA Facility pyramid fades in beside the
    // detached TA Facility box, followed by a single connecting line/
    // arrow from the box to the pyramid's base (Agroforestry) tier —
    // the one link kept from the earlier (removed) connecting-lines plan,
    // showing the existing facility feeding that base tier. All five
    // tiers at equal visual weight — de-emphasizing individual tiers is
    // the next sub-stage.
    .to("#ta-pyramid", { opacity: 1, duration: 0.8 }, "stage8+=0.2")
    .to("#ta-pyramid-link", { opacity: 1, duration: 0.4 }, "stage8+=1.0")
    .addLabel("stage9")
    // Stage 9 -> 10: the upper three tiers (Local Adaptation, Regional
    // Resilience, Global Mitigation) recede — a uniform opacity drop reads
    // as "still legible, clearly secondary" without changing any tier's
    // size/position/color values. Agroforestry and Improved Livelihoods
    // (untouched) stay at full weight throughout.
    .to("#pyramid-tier3, #pyramid-tier4, #pyramid-tier5", { opacity: 0.35, duration: 0.6 }, "stage9+=0.2")
    .addLabel("stage10")
    // Stage 10 -> 11: TA Facility — detached since stage 7->8, untouched
    // since — splits into 15 equal pieces and flies to the portfolio
    // grid, landing as a small bordered box (same box-rect style as the
    // top-level TA Facility box) beside each project's capital column —
    // mirroring the CFP Annex 2 structure at miniature scale, not a band
    // above/below it. The pyramid stays exactly where it is — a
    // standalone explainer of what the aggregate TA Facility feeds into,
    // not wired to each project-level piece. The TA->Agroforestry link
    // fades out in the same beat as the TA Facility box itself, since
    // once it's split into 15 pieces there's no single box left for that
    // line to originate from — an orphaned arrow pointing at nothing.
    // Mirrors the stage 6/7 split/flyout pacing: source box fades as its
    // pieces appear, then the pieces fly out staggered; each piece's "TA"
    // label only fades in once that piece has landed (labels don't fly).
    .to("#ta-facility, #ta-pyramid-link", { opacity: 0, duration: 0.3 }, "stage10+=0.3")
    .to(".ta-piece-rect", { opacity: 1, duration: 0.3 }, "stage10+=0.3")
    .to("#ta-piece-note", { opacity: 1, duration: 0.5 }, "stage10+=0.7");

  PROJECTS.forEach((p, i) => {
    const start = 0.5 + i * 0.04;
    tl.to(`#ta-piece-rect-${i}`, {
      attr: { x: p.taX, y: p.taY, width: p.taW, height: p.taH },
      duration: 0.9
    }, `stage10+=${start}`)
    .to(`#ta-piece-label-${i}`, {
      opacity: 1, duration: 0.3
    }, `stage10+=${start + 0.9}`);
  });

  tl.addLabel("stage11")
    // Stage 11 -> 12: a new, smaller "New Funding (KOICA)" box fades in at
    // the same detached-focus spot the original TA Facility box occupied —
    // dashed border marks it as a distinct, additional stream, not a
    // continuation of the original (now-split) solid box.
    .to("#new-funding", { opacity: 1, duration: 0.8 }, "stage11+=0.2")
    .addLabel("stage12")
    // Stage 12 -> 13: a dashed arrow — same blue, same arrowhead as the
    // TA link, but dashed to stay visually distinct — connects New
    // Funding to the Improved Livelihoods tier (one tier up from
    // Agroforestry, the TA link's target): the distinguishing point of
    // this funding stream.
    .to("#new-funding-link", { opacity: 1, duration: 0.5 }, "stage12+=0.2")
    .addLabel("stage13")
    // Stage 13 -> 14: New Funding splits into exactly 2 pieces (not 15 —
    // the contrast with TA Facility's even split) and flies out to land
    // beside the existing TA piece at 2 of the 15 projects. The box and
    // its arrow fade together (same lesson as the TA link: once the box
    // is gone, an arrow still pointing from it would be orphaned).
    // Mirrors the stage 10/11 split/flyout pacing at 2-piece scale.
    .to("#new-funding, #new-funding-link", { opacity: 0, duration: 0.3 }, "stage13+=0.3")
    .to(".nf-piece-rect", { opacity: 1, duration: 0.3 }, "stage13+=0.3");

  NEW_FUNDING_TARGETS.forEach((projectIndex, i) => {
    const p = PROJECTS[projectIndex];
    const start = 0.6 + i * 0.1;
    tl.to(`#nf-piece-rect-${i}`, {
      attr: { x: p.nfX, y: p.nfY, width: p.nfW, height: p.nfH },
      duration: 0.9
    }, `stage13+=${start}`)
    .to(`#nf-piece-label-${i}`, {
      opacity: 1, duration: 0.3
    }, `stage13+=${start + 0.9}`);
  });

  tl.to("#nf-note", { opacity: 1, duration: 0.5 }, "stage13+=2.0")
    .addLabel("stage14");

  const stages = ["stage1", "stage2", "stage3", "stage4", "stage5", "stage6", "stage7", "stage8", "stage9", "stage10", "stage11", "stage12", "stage13", "stage14"];
  const stageText = {
    stage1: "Stage 1 of 14 — CFP template, as published",
    stage2: "Stage 2 of 14 — Private Capital pulled out of the Blended Finance Structure",
    stage3: "Stage 3 of 14 — Senior Debt / Junior Debt fill the vacated column",
    stage4: "Stage 4 of 14 — Portfolio grid appears: 15 projects",
    stage5: "Stage 5 of 14 — Portfolio split: SAF capital merges and divides pro rata across 15 projects",
    stage6: "Stage 6 of 14 — Private Capital label updates to corporate buyers purchasing CRUs",
    stage7: "Stage 7 of 14 — Private Capital splits pro rata, layering local capital onto each project",
    stage8: "Stage 8 of 14 — Technical Assistance Facility detaches into its own focused view",
    stage9: "Stage 9 of 14 — TA Facility's 5-tier Theory of Change pyramid appears",
    stage10: "Stage 10 of 14 — Upper three pyramid tiers recede, keeping focus on the base",
    stage11: "Stage 11 of 14 — TA Facility splits pro rata, reaching all 15 projects evenly",
    stage12: "Stage 12 of 14 — New Funding box appears beside the pyramid",
    stage13: "Stage 13 of 14 — New Funding arrow connects to the Improved Livelihoods tier",
    stage14: "Stage 14 of 14 — New Funding splits in two, reaching 2 of the 15 projects"
  };

  let current = 0;
  const stageLabelEl = document.getElementById("stage-label");
  const prevBtn = document.getElementById("prev-btn");
  const nextBtn = document.getElementById("next-btn");
  const resetBtn = document.getElementById("reset-btn");

  function render() {
    stageLabelEl.textContent = stageText[stages[current]];
    prevBtn.disabled = current === 0;
    nextBtn.disabled = current === stages.length - 1;
    resetBtn.disabled = current === 0;
  }

  prevBtn.addEventListener("click", () => {
    if (current === 0) return;
    current--;
    tl.tweenTo(stages[current]);
    render();
  });

  nextBtn.addEventListener("click", () => {
    if (current === stages.length - 1) return;
    current++;
    tl.tweenTo(stages[current]);
    render();
  });

  // Jumps straight back to stage 1 (instant, not an animated rewind
  // through every stage in between) rather than clicking Prev repeatedly.
  resetBtn.addEventListener("click", () => {
    if (current === 0) return;
    current = 0;
    tl.seek(stages[current]);
    render();
  });

  // Spacebar advances one stage (same as Next), with the page's default
  // scroll-on-space suppressed. Arrow keys are wired to Prev/Next too,
  // as a free extra since they're the same one-line calls.
  document.addEventListener("keydown", (e) => {
    if (e.code === "Space") {
      e.preventDefault();
      nextBtn.click();
    } else if (e.code === "ArrowRight") {
      nextBtn.click();
    } else if (e.code === "ArrowLeft") {
      prevBtn.click();
    }
  });

  render();
</script>
</body>
</html>
